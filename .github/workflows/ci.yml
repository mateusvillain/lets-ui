name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint:css

      - name: Build packages
        run: pnpm build

      - name: Unit tests
        run: pnpm test

  brand-studio:
    name: Brand Studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The studio aliases the packages' `dist/` output by relative path
      # (see `astro.config.mjs`), so the workspace has to be built before the
      # app can be. It is not a dependency in `package.json` — it is a build
      # input, and a clean checkout has no `dist/` to point at.
      - name: Build the packages the studio consumes
        run: |
          pnpm install
          pnpm build

      # The studio itself is deliberately outside the pnpm workspace: it is a
      # browser app and must never enter the dependency graph of the published
      # packages. That is why it installs from its own lockfile.
      - name: Install dependencies
        run: pnpm install --ignore-workspace
        working-directory: apps/brand-studio

      - name: Build
        run: pnpm build
        working-directory: apps/brand-studio

      - name: Assert the build emitted a site
        run: test -f apps/brand-studio/dist/index.html
