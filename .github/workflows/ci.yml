name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint:css

      - name: Build packages
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit tests
        run: pnpm test

  brand-studio:
    name: Brand Studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The studio aliases the packages' `dist/` output by relative path
      # (see `astro.config.mjs`), so the workspace has to be built before the
      # app can be. It is not a dependency in `package.json` — it is a build
      # input, and a clean checkout has no `dist/` to point at.
      - name: Build the packages the studio consumes
        run: |
          pnpm install
          pnpm build

      # The studio itself is deliberately outside the pnpm workspace: it is a
      # browser app and must never enter the dependency graph of the published
      # packages. That is why it installs from its own lockfile.
      - name: Install dependencies
        run: pnpm install --ignore-workspace
        working-directory: apps/brand-studio

      - name: Build
        run: pnpm build
        working-directory: apps/brand-studio

      - name: Assert the build emitted a site
        run: test -f apps/brand-studio/dist/index.html

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The site styles itself with the tokens' `dist/` CSS, aliased by
      # relative path (see `astro.config.mjs`), so only the tokens package has
      # to be built first. Its content is the root `CHANGELOG.md`, read at
      # build time.
      - name: Build the tokens the site consumes
        run: |
          pnpm install
          pnpm --filter @lets-ui/tokens build

      # Outside the pnpm workspace, like the Brand Studio: a browser app must
      # never enter the dependency graph of the published packages.
      - name: Install dependencies
        run: pnpm install --ignore-workspace
        working-directory: apps/changelog

      - name: Build
        run: pnpm build
        working-directory: apps/changelog

      - name: Assert the build emitted a site
        run: |
          test -f apps/changelog/dist/index.html
          test -f apps/changelog/dist/pt/index.html
          test -f apps/changelog/dist/sitemap.xml

  systembook:
    name: SystemBook docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The previews import the packages' `dist/` output by relative path
      # (see `apps/systembook/previews/runtime.ts`), so the workspace has to be
      # built before the docs are.
      - name: Build the packages the previews consume
        run: |
          pnpm install
          pnpm build

      # Outside the pnpm workspace, like the Brand Studio: React and the
      # SystemBook CLI must never enter the dependency graph of the published
      # packages. That is why it installs from its own lockfile.
      - name: Install dependencies
        run: pnpm install --ignore-workspace
        working-directory: apps/systembook

      - name: Typecheck the previews
        run: pnpm exec tsc --noEmit
        working-directory: apps/systembook

      # Content, links, images and previews. Every error is listed at once.
      - name: Check the content
        run: pnpm docs:check
        working-directory: apps/systembook

      - name: Build the site
        run: pnpm docs:build
        working-directory: apps/systembook

      - name: Assert the build emitted a site
        run: test -f apps/systembook/systembook-dist/index.html
